name: Compilar y publicar APK

# Cada push a main compila la APK firmada con la clave del port y la publica en Releases.
# La clave va en los secretos del repositorio (Settings > Secrets and variables > Actions):
#   SORR_KEYSTORE_B64   el archivo sorr-release.jks en base64 (base64 -w0 sorr-release.jks)
#   SORR_KEYSTORE_PASS  su contrasena (si no se pone: "sorrport", la de la clave que se genero en el chat)
#   SORR_KEY_ALIAS      opcional (si no se pone, la primera que tenga el almacen)
# En realidad vale cualquier nombre: se usa el primer secreto que sea un almacen de claves en base64, y como
# contrasena el primero con PASS en el nombre que lo abra. Sin clave no se publica nada: una APK firmada con otra
# clave obligaria a desinstalar.

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'tools/**', 'tests/**' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL_TAG: release-2.30.9
  MIXER_TAG: release-2.8.0
  PNG_TAG: v1.6.44
  NDK_VER: 27.2.12479018

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar la clave de firma
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          set -e
          ks="$RUNNER_TEMP/sorr-release.jks"
          echo "Secretos del repositorio (solo nombres): $(printf '%s' "$ALL_SECRETS" | jq -r 'keys | join(", ")')"
          echo "Variables del repositorio (solo nombres): $(printf '%s' "$ALL_VARS" | jq -r 'keys | join(", ")')"
          all=$(jq -n --argjson s "$ALL_SECRETS" --argjson v "$ALL_VARS" '$v + $s')
          # La clave: el primer secreto (o variable) que, leido en base64, sea un almacen JKS o PKCS12
          found=""
          for name in $(printf '%s' "$all" | jq -r 'keys[]'); do
            [ "$name" = "github_token" ] && continue
            printf '%s' "$all" | jq -r --arg n "$name" '.[$n]' | tr -d ' \r\n' | base64 -d > "$ks.try" 2>/dev/null || continue
            magic=$(head -c 4 "$ks.try" | od -An -tx1 | tr -d ' \n')
            case "$magic" in feedfeed|cececece|3082*) found="$name"; mv "$ks.try" "$ks"; break ;; esac
          done
          if [ -z "$found" ]; then
            echo "::error::No hay clave de firma en los secretos. Crea uno (por ejemplo SORR_KEYSTORE_B64) con el contenido de 'base64 -w0 sorr-release.jks'."
            exit 1
          fi
          echo "Clave: secreto $found"
          # Contrasena: SORR_KEYSTORE_PASS o cualquier secreto con PASS en el nombre que abra el almacen; si no, "sorrport"
          pass=""
          for name in SORR_KEYSTORE_PASS $(printf '%s' "$all" | jq -r 'keys[] | select(test("PASS|PWD|CLAVE|CONTRA"; "i"))') __default__; do
            if [ "$name" = "__default__" ]; then try=sorrport; else try=$(printf '%s' "$all" | jq -r --arg n "$name" '.[$n] // empty'); fi
            [ -n "$try" ] || continue
            if keytool -list -keystore "$ks" -storepass "$try" > /dev/null 2>&1; then pass="$try"; echo "Contraseña: $name"; break; fi
          done
          if [ -z "$pass" ]; then
            echo "::error::Ninguna contraseña abre el almacen de claves: crea el secreto SORR_KEYSTORE_PASS."
            exit 1
          fi
          echo "::add-mask::$pass"
          alias=$(printf '%s' "$all" | jq -r '.SORR_KEY_ALIAS // .KEY_ALIAS // empty')
          [ -n "$alias" ] || alias=$(keytool -list -v -keystore "$ks" -storepass "$pass" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)
          kpass=$(printf '%s' "$all" | jq -r '.SORR_KEY_PASS // .KEY_PASSWORD // empty')
          [ -n "$kpass" ] || kpass="$pass"
          echo "::add-mask::$kpass"
          echo "Alias: $alias"
          keytool -list -v -keystore "$ks" -storepass "$pass" -alias "$alias" | grep -E "SHA256:" | head -1
          {
            echo "SORR_KEYSTORE=$ks"
            echo "SORR_KEY_ALIAS=$alias"
            echo "SORR_KEYSTORE_PASS=$pass"
            echo "SORR_KEY_PASS=$kpass"
          } >> "$GITHUB_ENV"

      - name: Instalar SDK y NDK de Android
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" "build-tools;35.0.0" "platforms;android-34" "ndk;$NDK_VER" > /dev/null
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Descargar SDL2, SDL_mixer y libpng
        run: |
          set -e
          mkdir -p src
          ln -sfn ../engine src/engine
          git clone -q --depth 1 -b "$SDL_TAG" https://github.com/libsdl-org/SDL src/SDL2
          git clone -q --depth 1 -b "$MIXER_TAG" https://github.com/libsdl-org/SDL_mixer src/SDL2_mixer
          git clone -q --depth 1 -b "$PNG_TAG" https://github.com/pnggroup/libpng src/libpng

      - name: Compilar la APK
        run: |
          set -e
          vname=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/AndroidManifest.xml)
          echo "VNAME=$vname" >> "$GITHUB_ENV"
          # versionCode siempre creciente para que cada APK se instale encima de la anterior
          SORR_REQUIRE_KEY=1 SORR_VERSION_CODE=$((1000 + ${{ github.run_number }})) \
            SORR_VERSION_NAME="$vname.${{ github.run_number }}" ROOT="$GITHUB_WORKSPACE" bash build_apk.sh
          mkdir -p salida
          cp out/SorR-Android.apk "salida/SorR-Android-v$vname.${{ github.run_number }}.apk"
          "$ANDROID_SDK/build-tools/35.0.0/apksigner" verify --print-certs out/SorR-Android.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: SorR-Android
          path: salida/*.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -e
          tag="v$VNAME.${{ github.run_number }}"
          {
            echo "Compilación automática del commit ${GITHUB_SHA::7}. / Automatic build of commit ${GITHUB_SHA::7}."
            echo
            printf '%s\n' "${COMMIT_MSG:-Compilación manual}" | grep -v "^Co-Authored-By\|^Claude-Session"
            echo
            echo "Necesitas el juego de PC (Streets of Rage Remake 5.2): la carpeta con SorR.dat, mod/ y palettes/."
            echo "You need the PC game (Streets of Rage Remake 5.2): the folder with SorR.dat, mod/ and palettes/."
          } > notas.md
          gh release create "$tag" salida/*.apk --title "Streets of Rage Remake Android $tag" --notes-file notas.md --latest
